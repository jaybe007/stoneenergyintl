<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="460" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>
  <!-- Geometric Monogram Emblem -->
  <g transform="translate(4, 5)">
    <!-- Hexagonal / Shield Silhouette -->
    <polygon points="30,2 58,18 58,52 30,68 2,52 2,18" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Inner Energy & Keystone Lines -->
    <path d="M30,10 L48,22 L48,46 L30,58 L12,46 L12,22 Z" fill="none" stroke="#F8FAFC" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
    <!-- Bold 'S' & Energy Bolt -->
    <path d="M36,18 L22,25 C18,27 18,32 23,34 L37,38 C42,40 42,45 37,47 L22,54" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="30" cy="35" r="3" fill="#FFFFFF" />
  </g>
  <!-- Typography -->
  <text x="78" y="32" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="1.5" fill="#0A192F">STONE ENERGY</text>
  <text x="290" y="32" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#D97706">INT'L LTD</text>
  <text x="80" y="52" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.8" fill="#475569">GENERAL CONTRACTOR &amp; MULTI-SECTOR SUPPLY SOLUTIONS</text>
</svg>
